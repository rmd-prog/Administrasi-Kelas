name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev libsqlite3-dev zlib1g-dev openjdk-17-jdk zip unzip wget
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer

    - name: Fix SDK Manager Structure
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmd.zip
        unzip -q cmd.zip
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        mv cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ || true
        rm -rf cmdline-tools cmd.zip
        
        # Buat symlink dummy sdkmanager agar Buildozer tidak memicu error missing file
        ln -sf ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # Inject Lisensi Google
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n8933373015501438a109655336099223b1a85571\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63718c303a6b28e0e4eb14d21f323d6a" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Build APK
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Penilaian-APK
        path: bin/*.apk
